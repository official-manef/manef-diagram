name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e -- --reporter=github,list
      - run: bun run test:dev
      - run: bun run build && node scripts/smoke-node.mjs
        env:
          DEPLOY_TARGET: node
      - run: bun run build && bunx wrangler types --env pilot --include-runtime false --check && bunx wrangler deploy --env pilot --dry-run --outdir .wrangler/dry-run
        env:
          DEPLOY_TARGET: cloudflare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-failure
          path: test-results/
          retention-days: 7
